<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SiW Game</title>
    <link rel="stylesheet" href="/src/index.css" />
    <style>
      /* technical.md 5.4 : un seul point de montage React — App.jsx choisit l'écran affiché
         (technical.md 5), et BattleScreen.jsx définit lui-même son propre layout canevas +
         sidebar (technical.md 2.2/3.1) le temps qu'il est monté.
         Desktop uniquement : tous les écrans tiennent sans défilement à partir de 1024×560 (fenêtre
         de navigateur d'un petit portable) ; en dessous, le surplus scrolle plutôt que d'écraser
         les éléments (pas de mode "petit écran" pour la v1, technical.md 3.1). */
      html, body, #root {
        height: 100%;
        margin: 0;
      }
      body {
        min-width: 1024px;
        min-height: 560px;
        /* Même noir que le fond des écrans (GRAPHICS.md « Interface », bg-neutral-900) : aucune
           bande visible si la page dépasse la fenêtre. */
        background: #171717;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
